{% extends 'base.html' %}
{% block content %}
{% load static %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto mb-3">
        <h2>Hidden Movies</h2>
        <hr />
        <a href="{% url 'movies.index' %}" class="btn btn-primary mb-3">Back to Movies</a>
      </div>
    </div>
    <div class="row">
      {% for movie in template_data.movies %}
      <div class="col-md-4 col-lg-3 mb-2">
        <div class="p-2 card align-items-center pt-4">
          <img src="{{ movie.image.url }}" class="card-img-top rounded img-card-200">
          <div class="card-body text-center">
            <a href="{% url 'movies.show' id=movie.id %}" class="btn bg-dark text-white">
              {{ movie.name }}
            </a>
            <form action="{% url 'movies.unhide' id=movie.id %}" method="POST" class="mt-2">
              {% csrf_token %}
              <button type="submit" class="btn btn-sm btn-success">
                <i class="fas fa-eye"></i> Unhide
              </button>
            </form>
          </div>
        </div>
      </div>
      {% empty %}
      <p>No hidden movies.</p>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock content %}
